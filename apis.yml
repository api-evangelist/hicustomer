name: HiCustomer
description: >-
  HiCustomer (ハイカスタマー) was a Japanese Customer Success Management (CSM) SaaS
  built specifically for SaaS companies. Its platform aggregated customer data
  scattered across BI tools, CRMs, and chat tools to visualize product usage,
  communication history, revenue, and contract information in one place. Teams
  used configurable health-score rules to monitor account health across the
  customer lifecycle, and custom alerts to surface churn and upsell signals at
  the right moment, with time-series analysis to make customer-success outreach
  repeatable. The company also offered customer-success consulting, and later
  pivoted to a digital sales room product, "Arch by HiCustomer". On 2024-09-13
  HiCustomer Inc. sold the Arch business to the Tokyo-listed adtech company
  Geniee, Inc. (TSE 6562), which absorbed it into GENIEE SFA/CRM and rebranded
  it Geniee DSR. As of this enrichment pass the hicustomer.jp domain no longer
  resolves to a live site (its authoritative AWS Route 53 zone is delegated but
  empty) and the product is discontinued; the last archived homepage (Oct 2024)
  is a STUDIO-built single-page "About the company" placeholder. No public
  developer API, documentation, SDK, or developer portal was ever published —
  the Wayback record for hicustomer.jp contains no /api, /docs, /developers,
  /pricing or /status path at any point in its history.
